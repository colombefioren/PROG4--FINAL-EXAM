<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${title}">Grade transcript</title>
  <style>
    body { font-family: Helvetica, Arial, sans-serif; font-size: 12px; color: #1a1a1a; }
    h1 { font-size: 18px; margin-bottom: 0; }
    .meta { color: #555; margin-bottom: 16px; }
    .summary-box { margin-top: 16px; padding: 8px; background-color: #f5f5f5; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { border: 1px solid #ccc; padding: 4px 6px; text-align: left; }
    th { background-color: #eee; }
    .passed { color: #0a7a2f; font-weight: bold; }
    .not-passed { color: #b00020; font-weight: bold; }
  </style>
</head>
<body>
  <h1>HEI - Higher School of Informatics</h1>
  <p class="meta">
    <span th:text="${title}">Grade transcript</span> - Student: <span th:text="${studentName}">Name</span>
    (<span th:text="${stdRef}">STD00000</span>) - generated on <span th:text="${generatedAt}">date</span>
  </p>

  <div class="summary-box">
    <p>Level average: <strong th:text="${overallAverage}">-</strong></p>
    <p>Status: <strong th:text="${complete}">-</strong></p>
    <p>Credits: <span th:text="${earnedCredits}">0</span> / <span th:text="${totalCredits}">0</span></p>
  </div>

  <table>
    <thead>
      <tr>
        <th>Code</th>
        <th>Subject</th>
        <th>Credits</th>
        <th>Average</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="course : ${courses}">
        <td th:text="${course.code}">CODE</td>
        <td th:text="${course.name}">Name</td>
        <td th:text="${course.credits}">0</td>
        <td th:text="${course.average}">-</td>
        <td th:text="${course.validated}"
            th:class="${course.validated == 'Passed'} ? 'passed' : 'not-passed'">-</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
