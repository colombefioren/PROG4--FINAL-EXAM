<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${title}">Relevé de notes</title>
  <style>
    body { font-family: Helvetica, Arial, sans-serif; font-size: 12px; color: #1a1a1a; }
    h1 { font-size: 18px; margin-bottom: 0; }
    .meta { color: #555; margin-bottom: 16px; }
    .summary-box { margin-top: 16px; padding: 8px; background-color: #f5f5f5; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { border: 1px solid #ccc; padding: 4px 6px; text-align: left; }
    th { background-color: #eee; }
    .validated { color: #0a7a2f; font-weight: bold; }
    .not-validated { color: #b00020; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Haute École d'Informatique</h1>
  <p class="meta">
    <span th:text="${title}">Relevé de notes</span> - Étudiant: <span th:text="${studentName}">Nom</span>
    (<span th:text="${stdRef}">STD00000</span>) - généré le <span th:text="${generatedAt}">date</span>
  </p>

  <div class="summary-box">
    <p>Moyenne du niveau: <strong th:text="${overallAverage}">-</strong></p>
    <p>Statut: <strong th:text="${complete}">-</strong></p>
    <p>Crédits: <span th:text="${earnedCredits}">0</span> / <span th:text="${totalCredits}">0</span></p>
  </div>

  <table>
    <thead>
      <tr>
        <th>Code</th>
        <th>Matière</th>
        <th>Crédits</th>
        <th>Moyenne</th>
        <th>Statut</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="course : ${courses}">
        <td th:text="${course.code}">CODE</td>
        <td th:text="${course.name}">Nom</td>
        <td th:text="${course.credits}">0</td>
        <td th:text="${course.average}">-</td>
        <td th:text="${course.validated}"
            th:class="${course.validated == 'Validé'} ? 'validated' : 'not-validated'">-</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
