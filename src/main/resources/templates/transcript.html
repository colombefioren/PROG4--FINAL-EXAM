<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${title}">Grade transcript</title>
  <style>
    body { font-family: Helvetica, Arial, sans-serif; font-size: 12px; color: #1a1a2e; margin: 0; }
    .header { background-color: #1a73e8; color: #ffffff; padding: 16px 20px; border-radius: 8px; }
    .header h1 { font-size: 18px; margin: 0 0 4px 0; }
    .header .subtitle { font-size: 12px; color: #d9e6ff; }
    .meta { color: #5f6368; margin: 12px 2px 0 2px; font-size: 11px; }
    .summary { width: 100%; border-collapse: separate; border-spacing: 8px 0; margin: 16px -8px 0 -8px; }
    .summary td { width: 33%; background-color: #f8fafc; border: 1px solid #e4e8ee; border-radius: 8px; padding: 10px 14px; }
    .summary .label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: #5f6368; }
    .summary .value { font-size: 16px; font-weight: bold; margin-top: 4px; }
    .summary .value.average { color: #1a73e8; }
    .summary .value.complete { color: #0a7a2f; }
    .summary .value.provisional { color: #b45309; }
    table.courses { width: 100%; border-collapse: collapse; margin-top: 16px; }
    table.courses th { background-color: #1a73e8; color: #ffffff; padding: 8px 10px; text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
    table.courses td { border-bottom: 1px solid #e4e8ee; padding: 8px 10px; font-size: 12px; }
    table.courses tr:nth-child(even) td { background-color: #f8fafc; }
    .passed { color: #0a7a2f; font-weight: bold; }
    .not-passed { color: #b00020; font-weight: bold; }
    .not-graded { color: #5f6368; }
    .footer { margin-top: 20px; padding-top: 8px; border-top: 2px solid #1a73e8; font-size: 10px; color: #5f6368; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <h1>HEI - Haute École d'Informatique</h1>
    <div class="subtitle" th:text="${title}">Grade transcript</div>
  </div>

  <p class="meta">
    Student: <strong th:text="${studentName}">Name</strong> (<span th:text="${stdRef}">STD00000</span>)
    - generated on <span th:text="${generatedAt}">date</span>
  </p>

  <table class="summary">
    <tr>
      <td>
        <div class="label">Level average</div>
        <div class="value average" th:text="${overallAverage}">-</div>
      </td>
      <td>
        <div class="label">Status</div>
        <div class="value"
            th:text="${complete}"
            th:classappend="${complete == 'Complete'} ? 'value complete' : 'value provisional'">-</div>
      </td>
      <td>
        <div class="label">Credits</div>
        <div class="value">
          <span th:text="${earnedCredits}">0</span> / <span th:text="${totalCredits}">0</span>
        </div>
      </td>
    </tr>
  </table>

  <table class="courses">
    <thead>
      <tr>
        <th>Code</th>
        <th>Subject</th>
        <th>Credits</th>
        <th>Average</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="course : ${courses}">
        <td th:text="${course.code}">CODE</td>
        <td th:text="${course.name}">Name</td>
        <td th:text="${course.credits}">0</td>
        <td th:text="${course.average}">-</td>
        <td th:text="${course.validated}"
            th:class="${course.validated == 'Passed'} ? 'passed' : (${course.validated == 'Not passed'} ? 'not-passed' : 'not-graded')">-</td>
      </tr>
    </tbody>
  </table>

  <div class="footer">
    HEI - Haute École d'Informatique - Official document generated on
    <span th:text="${generatedAt}">date</span>
  </div>
</body>
</html>
