<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Sign in</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #f5f5f5;
      }
      .card {
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 2rem;
        width: 24rem;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
      }
      h1 {
        margin-top: 0;
        font-size: 1.4rem;
      }
      label {
        display: block;
        margin-bottom: 1rem;
        font-size: 0.9rem;
      }
      input {
        display: block;
        width: 100%;
        box-sizing: border-box;
        margin-top: 0.25rem;
        padding: 0.5rem;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        width: 100%;
        padding: 0.6rem;
        border: none;
        border-radius: 4px;
        background: #1a73e8;
        color: #fff;
        font-size: 0.95rem;
        cursor: pointer;
      }
      .error {
        color: #d93025;
        font-size: 0.9rem;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Sign in</h1>
      <p th:if="${error}" class="error" th:text="${error}">Invalid credentials</p>
      <form method="post" action="/ui/login">
        <label>
          Email
          <input type="email" name="email" required autofocus />
        </label>
        <label>
          Password
          <input type="password" name="password" required />
        </label>
        <button type="submit">Login</button>
      </form>
    </div>
  </body>
</html>
