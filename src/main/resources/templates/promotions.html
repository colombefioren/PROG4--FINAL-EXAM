<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Graduate Lists</title>
    <link rel="stylesheet" th:href="@{/css/promotions.css}" />
  </head>
  <body>
    <form method="post" action="/ui/logout">
      <button type="submit" class="logout">Logout</button>
    </form>
    <h1>Promotions</h1>
    <table>
      <thead>
        <tr>
          <th>Reference</th>
          <th>Name</th>
          <th>Entry year</th>
          <th>Graduate list</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="promotion : ${promotions}">
          <td th:text="${promotion.ref()}">REF</td>
          <td th:text="${promotion.name()}">Name</td>
          <td th:text="${promotion.entryYear()}">2025</td>
          <td>
            <button
              type="button"
              class="graduate-download"
              th:attr="data-promotion-id=${promotion.id()}"
            >
              Download Graduate List
            </button>
          </td>
        </tr>
      </tbody>
    </table>
    <script th:inline="none">
      document.querySelectorAll('.graduate-download').forEach((button) => {
        button.addEventListener('click', () =>
          downloadGraduateList(button.dataset.promotionId),
        );
      });

      async function downloadGraduateList(promotionId) {
        try {
          const response = await fetch(
            `/promotions/${promotionId}/graduates/download`,
          );
          if (!response.ok) {
            throw new Error(`Download failed with status ${response.status}`);
          }
          const blob = await response.blob();
          const url = URL.createObjectURL(blob);
          const disposition = response.headers.get('Content-Disposition');
          const match = disposition && disposition.match(/filename="([^"]+)"/);
          const link = document.createElement('a');
          link.href = url;
          link.download = match ? match[1] : `${promotionId} - GRADUATE LIST.xlsx`;
          document.body.appendChild(link);
          link.click();
          link.remove();
          URL.revokeObjectURL(url);
        } catch (error) {
          alert(error.message);
        }
      }
    </script>
  </body>
</html>
